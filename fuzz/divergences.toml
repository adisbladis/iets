# Known divergences of the fuzz targets from Nix 2.34.8: each one a hit
# the fuzzer reports as expected, not as a bug. A hit matches an entry
# when every field the entry gives matches. Format and meaning:
# docs/reference/fuzz.md.
#
#   [[parse]]       # or [[nar]] for the nar-* targets, [[drv]] for drv-*,
#                   # [[wire]] for wire, [[eval]] for eval, [[drv-eval]]
#                   # for drv-eval
#   id = "..."      # names the case; reports count hits per id
#   doc = "..."     # the section of docs/reference/divergences.md
#   kind = "..."    # optional: one of the target's kinds
#                   # (docs/reference/fuzz.md)
#   input = "..."   # optional: the input contains these bytes
#   nix = "..."     # optional: Nix's side of the report contains this
#   iets = "..."    # optional: iets's side of the report contains this
#   float_digits = true  # optional: the two differ only in how they write
#                        # numbers that are one double
#   names_differ = true  # optional: the two errors name different things
#                        # (the first '...' of each message)

[[parse]]
id = "nul-outside-a-string"
doc = "docs/reference/divergences.md#a-nul-byte-outside-a-string"
input = "\u0000"
iets = "unexpected invalid token"

[[parse]]
id = "which-duplicate-formal"
doc = "docs/reference/divergences.md#which-of-several-clashes-an-error-names"
kind = "position"
nix = "duplicate formal function argument"
iets = "duplicate formal function argument"
names_differ = true

[[parse]]
id = "which-duplicate-attribute"
doc = "docs/reference/divergences.md#which-of-several-clashes-an-error-names"
kind = "position"
nix = "already defined at"
iets = "already defined at"
names_differ = true

[[parse]]
id = "percent-in-a-cursed-or"
doc = "docs/reference/divergences.md#a--in-an-or-argument"
kind = "iets-only"
input = "%"
nix = "boost::"

[[parse]]
id = "percent-in-a-cursed-or-abort"
doc = "docs/reference/divergences.md#a--in-an-or-argument"
kind = "nix-crash"
input = "%"
nix = "SIGABRT"

[[wire]]
id = "output-name-not-utf8"
doc = "docs/reference/divergences.md#bytes-that-are-not-utf-8-in-a-derivation"
kind = "answer"
iets = "outputs "
nix = "�"

[[wire]]
id = "nar-content-padding"
doc = "docs/reference/divergences.md#padding-in-a-nar-from-the-daemon"
kind = "nix-only"
iets = "bad NAR: non-zero padding"

[[wire]]
id = "store-path-without-a-dash"
doc = "docs/reference/divergences.md#a-store-path-without-a-dash"
kind = "nix-only"
iets = "is not a valid store path: missing dash"

[[eval]]
id = "repeated-list"
doc = "docs/reference/divergences.md#repeated-for-a-list"
kind = "value"
nix = "«repeated»"

[[eval]]
id = "stack-depth"
doc = "docs/reference/divergences.md#the-limits-of-a-run"
kind = "iets-only"
nix = "stack overflow"

[[eval]]
id = "json-float-digits"
doc = "docs/reference/divergences.md#the-digits-of-a-float-in-tojson"
kind = "value"
float_digits = true

# `==`, `!=` and `elem` take equal words as equal without forcing what is
# inside, where Nix compares and throws

[[eval]]
id = "eq-shortcut"
doc = "docs/reference/divergences.md#unforced-values-in-lazy-positions"
kind = "eq-rule"

[[drv]]
id = "drv-string-not-utf8"
doc = "docs/reference/divergences.md#reading-a-drv-file"
kind = "nix-only"
iets = "non-UTF-8 string in derivation"

[[drv]]
id = "drv-blake3-without-feature"
doc = "docs/reference/divergences.md#reading-a-drv-file"
kind = "iets-only"
nix = "experimental Nix feature 'blake3-hashes' is disabled"

[[drv]]
id = "drv-impure-output"
doc = "docs/reference/divergences.md#reading-a-drv-file"
kind = "nix-only"
iets = "impure derivations are not supported"

[[drv]]
id = "drv-git-hash-method"
doc = "docs/reference/divergences.md#reading-a-drv-file"
kind = "nix-only"
iets = "unsupported output hash method"

[[drv]]
id = "store-path-without-dash"
doc = "docs/reference/divergences.md#reading-a-drv-file"
kind = "nix-only"
iets = "is not a valid store path: missing dash"

[[drv]]
id = "store-path-not-canonical"
doc = "docs/reference/divergences.md#reading-a-drv-file"
kind = "nix-only"
iets = "is not in the Nix store"

[[drv]]
# an iets bug, not a choice: this entry hides every difference in the
# outputs until src/store/drv.rs keeps the first of two outputs; remove it then
id = "drv-duplicate-output"
doc = "docs/reference/divergences.md#reading-a-drv-file"
kind = "aterm-outputs"

[[drv-eval]]
id = "drv-eval-builder-not-utf8"
doc = "docs/reference/divergences.md#bytes-that-are-not-utf-8-in-a-derivation"
kind = "nix-only"
input = "\"builder\" = (builtins.substring 0 1 \"é\")"
iets = "string is not valid UTF-8"

[[drv-eval]]
id = "drv-eval-system-not-utf8"
doc = "docs/reference/divergences.md#bytes-that-are-not-utf-8-in-a-derivation"
kind = "nix-only"
input = "\"system\" = (builtins.substring 0 1 \"é\")"
iets = "string is not valid UTF-8"

[[drv-eval]]
id = "drv-eval-env-name-not-utf8"
doc = "docs/reference/divergences.md#bytes-that-are-not-utf-8-in-a-derivation"
kind = "nix-only"
input = "${builtins.substring 0 1 \"é\"} ="
iets = "string is not valid UTF-8"

[[drv-eval]]
id = "drv-eval-text-mode-without-feature"
doc = "docs/reference/divergences.md#experimental-feature-builtins"
kind = "iets-only"
input = "\"outputHashMode\" = \"text\""
nix = "dynamic-derivations"

[[drv-eval]]
id = "drv-eval-system-features-without-feature"
doc = "docs/reference/divergences.md#experimental-feature-builtins"
kind = "nix-only"
input = "\"requiredSystemFeatures\""
iets = "expected a "

[[drv-eval]]
id = "drv-eval-blake3-without-feature"
doc = "docs/reference/divergences.md#experimental-feature-builtins"
kind = "iets-only"
input = "\"outputHashAlgo\" = \"blake3\""
nix = "blake3-hashes"
